// ── GovMap במיקום שלי: המרת מיקום המכשיר (WGS84) לרשת ישראל החדשה (ITM) ופתיחת GovMap עם שכבות גוש/חלקה ──
const _ITM={a:6378137,f:1/298.257222101,lat0:31.7343936111111*Math.PI/180,lon0:35.2045169444444*Math.PI/180,k0:1.0000067,fe:219529.584,fn:626907.39};
function _tmM(phi){const {a,f}=_ITM,e2=2*f-f*f,e4=e2*e2,e6=e4*e2;
  return a*((1-e2/4-3*e4/64-5*e6/256)*phi-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*phi)+(15*e4/256+45*e6/1024)*Math.sin(4*phi)-(35*e6/3072)*Math.sin(6*phi));}
function wgsToItm(lat,lon){
  const {a,f,lat0,lon0,k0,fe,fn}=_ITM,e2=2*f-f*f,ep2=e2/(1-e2),phi=lat*Math.PI/180,lam=lon*Math.PI/180;
  const s=Math.sin(phi),c=Math.cos(phi),t=Math.tan(phi),N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep2*c*c,A=(lam-lon0)*c;
  return {x:fe+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120),
    y:fn+k0*(_tmM(phi)-_tmM(lat0)+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))};
}

// דחיסת תמונה בצד הלקוח (הקטנה + JPEG) — מחזיר Blob
function compressImage(file,maxDim,quality){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} }
      else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} }
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>resolve(b),'image/jpeg',quality);
    };
    img.onerror=()=>resolve(null);
    const rd=new FileReader();rd.onload=e=>{img.src=e.target.result;};rd.readAsDataURL(file);
  });
}
const blobToDataURL=blob=>new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>res(null);r.readAsDataURL(blob);});

// בניית עמודת "חלוקה" (Q) ממוזגת פר-מפלס + הערה אם יש שוני בגימור

  if(anyDiff)q=(q?q+' ':'')+'(יש לעיין בדוח הביקור לגבי שוני במפרט גימור בין המפלסים)';

function parseDivision(o){

const _blobToDataURL=blobToDataURL, imgToBlob=compressImage;
// ── מנוע העלאת קבצי ביקור (זהה למנוע שבאתר; כאן it.folderId מחזיק את טוקן הקישור ונשלח כ-t) ──
// תור של 3 קבצים במקביל · ניסיונות חוזרים · סרטונים בחלקים עם המשך מהנקודה שנעצרה · דילוג על קובץ שכבר קיים בתיקייה ·

const VU_PAR=3, VU_TRIES=3, VU_CHUNK=8*1024*1024, VU_STALL=60000, VU_AFTER=30000, VU_FALLBACK_MB=15, VU_MAX_VIDEO_MB=2048;

// קריאה לסקריפט הביקור עם הגבלת זמן — מחזיר JSON או null
async function extPost(body,ms){
  const ac=(typeof AbortController!=='undefined')?new AbortController():null;
  const tm=ac?setTimeout(()=>ac.abort(),ms||30000):null;
  try{const r=await fetch(EXT_APPS_URL,Object.assign({method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)},ac?{signal:ac.signal}:{}));return await r.json();}

}
// PUT של בייטים ל-Drive (session URI), עם זיהוי היתקעות. מחזיר {status,sent}; status 0 = אין תשובה קריאה
function vuPut(url,blob,range,type,onProg){
  return new Promise(resolve=>{
    let sent=false,fin=false,timer=null;const xhr=new XMLHttpRequest();
    const finish=st=>{if(fin)return;fin=true;if(timer)clearTimeout(timer);resolve({status:st,sent});};
    const arm=ms=>{if(timer)clearTimeout(timer);timer=setTimeout(()=>{try{xhr.abort();}catch(_){}finish(0);},ms);};
    try{
      xhr.open('PUT',url,true);
      xhr.setRequestHeader('Content-Type',type||'application/octet-stream');
      if(range)xhr.setRequestHeader('Content-Range',range);
      if(xhr.upload){
        xhr.upload.onprogress=ev=>{if(!ev.lengthComputable)return;if(onProg)onProg(ev.loaded/ev.total);if(ev.loaded>=ev.total){sent=true;arm(VU_AFTER);}else arm(VU_STALL);};

      }
      xhr.onload=()=>finish(xhr.status);xhr.onerror=()=>finish(0);xhr.onabort=()=>finish(0);
      arm(VU_STALL);xhr.send(blob);
    }catch(_){finish(0);}
  });
}
async function vuStart(it){

// העלאה בבקשה אחת (תמונות וקבצים קטנים) → 'ok' / 'unverified' (נשלח, אין אישור) / 'fail'

// העלאה בחלקים של 8MB (סרטונים): אחרי תקלה שואלים את Drive כמה התקבל וממשיכים משם → 'ok' / 'unverified' / 'fail' / 'nochunk'

// תאריך הצילום מתוך ה-EXIF של JPEG → 'YYYYMMDD_HHMMSS' (או '' אם אין)
async function exifDate(file){

    const v=new DataView(await file.slice(0,262144).arrayBuffer());
    if(v.getUint16(0)!==0xFFD8)return '';
    let p=2;
    while(p+4<v.byteLength){
      if(v.getUint8(p)!==0xFF)return '';
      const mk=v.getUint8(p+1),len=v.getUint16(p+2);
      if(mk===0xE1&&v.getUint32(p+4)===0x45786966){
        const t=p+10,le=v.getUint16(t)===0x4949;
        const u16=o=>v.getUint16(o,le),u32=o=>v.getUint32(o,le);
        const find=(ifd,tag)=>{const n=u16(ifd);for(let i=0;i<n;i++){const e=ifd+2+i*12;if(u16(e)===tag)return t+u32(e+8);}return 0;};

// שם הקובץ ב-Drive: לפי תאריך ושעת הצילום (כמו במצלמה: 20261124_114519.jpg), כדי שלא יישמר המספר הסידורי שבורר התמונות של אנדרואיד נותן
async function visitMediaName(file,isVideo,pickedAt){

  // הוספת קבצים שנבחרו לתיקיית Drive של התיק
  async add(fileList,folderId){
    const pickedAt=Date.now(),fresh=[];
    for(const file of fileList){
      // אותו קובץ כבר ברשימה של התיק הזה? לא מוסיפים שוב (אם נכשל קודם — מחזירים אותו לתור)
      const dup=this.items.find(x=>x.folderId===folderId&&x.orig===file.name&&x.osize===file.size);
      if(dup){if(dup.status==='failed'&&dup.blob){dup.status='queued';dup.note='';}continue;}
      const it={id:++this.seq,folderId,file,orig:file.name,osize:file.size,isVideo:/^video\//.test(file.type),name:file.name,url:'',status:'prep',prog:0,note:'',blob:null};
      this.items.push(it);fresh.push(it);
    }
    this.lock();this.emit();
    const existing=fresh.length?await vuList(folderId):null;
    for(const it of fresh){
      const file=it.file;it.file=null;
      if(it.isVideo&&file.size>VU_MAX_VIDEO_MB*1024*1024){this.patch(it,{status:'failed',note:'סרטון גדול מדי (מעל 2GB)'});continue;}
      let name=await visitMediaName(file,it.isVideo,pickedAt);
      if(this.items.some(x=>x!==it&&x.folderId===folderId&&x.name===name)){   // שני קבצים שונים מאותה שנייה — מוסיפים את השם המקורי
        const ob=String(it.orig||'').replace(/\.[^.]+$/,''),m=name.match(/^(.*)(\.[^.]+)$/);name=m[1]+'_'+(ob||it.id)+m[2];
      }
      it.name=name;
      if(existing&&existing[name]){this.patch(it,{status:'exists'});continue;}
      if(it.isVideo)it.blob=file;
      else{
        const b=await imgToBlob(file,2560,0.9);
        if(b){it.blob=b;it.url=URL.createObjectURL(b);}
        else{it.blob=file;it.name=name.replace(/\.jpg$/,(String(it.orig||'').match(/\.[A-Za-z0-9]{2,5}$/)||['.jpg'])[0].toLowerCase());}   // לא נפתחה כתמונה — עולה כמו שהיא
      }
      this.patch(it,{status:'queued'});this.pump();
    }
    this.pump();
  },
  async addReady(list,key){
    const fresh=list.filter(p=>!this.items.some(x=>x.src===p)).map(p=>({id:++this.seq,folderId:key,src:p,isVideo:!!p.isVideo,name:p.name,url:p.url||'',status:'prep',prog:0,note:'',blob:p.blob}));
    this.items.push(...fresh);this.lock();this.emit();
    const existing=fresh.length?await vuList(key):null;
    fresh.forEach(it=>{it.status=(existing&&existing[it.name])?'exists':'queued';});
    this.emit();this.pump();
  },
  pump(){
    while(this.running<VU_PAR){
      const it=this.items.find(x=>x.status==='queued');if(!it)break;
      this.running++;it.status='uploading';it.prog=0;this.lock();this.emit();
      vuRun(it).then(s=>{it.status=s;},()=>{it.status='verify';}).then(()=>{this.running--;this.emit();this.pump();});
    }
    if(!this.running&&!this.items.some(x=>x.status==='queued'||x.status==='prep'))this.verify();
  },
  // אימות מול התיקייה: קובץ שנשלח אבל לא התקבל עליו אישור מסומן ✓ רק אם הוא באמת נמצא ב-Drive
  async verify(){
    if(this.verifying)return;
    const pend=this.items.filter(x=>x.status==='verify');
    if(!pend.length){this.unlock();this.emit();return;}
    this.verifying=true;this.emit();
    for(const fid of [...new Set(pend.map(x=>x.folderId))]){
      const mine=pend.filter(x=>x.folderId===fid);
      let m=await vuList(fid);
      if(m&&mine.some(x=>!m[x.name])){await _sleep(4000);m=(await vuList(fid))||m;}
      mine.forEach(x=>{
        const ok=m?!!m[x.name]:!!x.sentAll;   // אין אפשרות לבדוק (אין רשת / סקריפט ישן) — מסתמכים על כך שכל הבייטים נשלחו
        x.status=ok?'done':'failed';if(!ok)x.note='הקובץ לא הגיע ל-Drive';
      });
    }
    this.verifying=false;this.emit();
    if(this.items.some(x=>x.status==='queued'))this.pump();else{this.unlock();this.emit();}
  },
  retry(folderId){
    this.items.forEach(x=>{if(x.folderId===folderId&&x.status==='failed'&&x.blob){x.status='queued';x.note='';x.sentAll=false;}});
    this.emit();this.pump();
  },
};

function missingRequiredVisitFields(f){
  const miss=[];
  for(const fl of VISIT_FIELDS){
    if(!fl.k) continue;
    if(fl.k==='divisionLevels'||fl.k==='levelSpecs') continue;
    if(fl.showIf&&!fl.showIf(f)) continue;
    const v=f[fl.k];
    let filled;
    if(fl.t==='check') filled=v===true;
    else if(fl.t==='multi') filled=Array.isArray(v)?v.length>0:!!(v&&String(v).trim());
    else filled=!!(v&&String(v).trim());
    if(!filled) miss.push(fl.l);
  }
  const items0=(((f.divisionLevels||[])[0])||{}).items||[];
  if(!(items0.includes('סלון')&&items0.length>=2)) miss.push('חלוקה — לפחות סלון + פרמטר נוסף');
  return miss;
}

      const cur=v||[];const canOther=!fl.noOther;const otherActive=canOther&&f[fl.k+'__oon'];
      inp=<div>
        <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
          {fl.o.map(o=>optBtn(cur.includes(o),()=>toggleMulti(fl.k,o),o,o))}
          {canOther&&optBtn(otherActive,()=>setF(s=>{const on=!s[fl.k+'__oon'];return on?{...s,[fl.k+'__oon']:true}:{...s,[fl.k+'__oon']:false,[fl.k+'__oth']:''};}),'אחר','__o')}
        </div>
        {otherActive&&<input value={f[fl.k+'__oth']||''} onChange={e=>set(fl.k+'__oth',e.target.value)} placeholder="הקלד..." style={{...iS,marginTop:8,fontSize:14}}/>}
      </div>;
    }
    else if(fl.t==='divisions'){
      const levels=(v&&v.length)?v:[{name:'',items:[]}];
      const setLevels=upd=>set(fl.k,upd);
      const toggleItem=(li,room)=>setLevels(levels.map((lv,j)=>j===li?{...lv,items:(lv.items||[]).includes(room)?(lv.items||[]).filter(x=>x!==room):[...(lv.items||[]),room]}:lv));
      const setName=(li,name)=>setLevels(levels.map((lv,j)=>j===li?{...lv,name}:lv));
      const setFree=(li,free)=>setLevels(levels.map((lv,j)=>j===li?{...lv,free}:lv));
      const addLevel=()=>setLevels([...levels,{name:'',items:[]}]);
      const removeLevel=li=>setLevels(levels.filter((_,j)=>j!==li));
      inp=<div>
        {levels.map((lv,li)=>(
          <div key={li} style={li>0?{marginTop:10,padding:'10px 12px',border:'1px solid #ede8e0',borderRadius:10,background:'#fdfaf5'}:{marginBottom:6}}>
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
              <input value={lv.name||''} onChange={e=>setName(li,e.target.value)} placeholder='שם קומה / מפלס / יח"ד (אופציונלי)' style={{...iS,fontSize:14,flex:1}}/>
              {li>0&&<button type="button" onClick={()=>removeLevel(li)} title="הסר קומה" style={{background:'none',border:'none',cursor:'pointer',color:'#c0392b',fontSize:16,lineHeight:1}}>🗑</button>}
            </div>
            <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>{DIVISION_OPTS.map(o=>optBtn((lv.items||[]).includes(o),()=>toggleItem(li,o),o,o))}</div>
            <textarea value={lv.free||''} onChange={e=>setFree(li,e.target.value)} rows={2} placeholder="פירוט חופשי (במידה והחדר לא קיים באפשרויות הבחירה)" style={{...iS,fontSize:14,marginTop:8,resize:'vertical',lineHeight:1.5}}/>
          </div>
        ))}
        <button type="button" onClick={addLevel} style={{marginTop:10,border:`1.5px dashed ${GOLD}`,background:'#fff',color:GOLD3,borderRadius:9,padding:'8px 14px',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'inherit'}}>➕ הוסף קומה / מפלס / יח"ד</button>
      </div>;
    }
    else if(fl.t==='levelSpecs'){
      const levels=(f.divisionLevels&&f.divisionLevels.length)?f.divisionLevels:[{name:'',items:[]}];
      const setFinish=(li,finish)=>set('divisionLevels',levels.map((lv,j)=>j===li?{...lv,finish}:lv));
      inp=<div>
        {levels.map((lv,li)=>{
          const fin=String(lv.finish||'');
          const status=fin.replace(/^\s+/,'').indexOf('לא זהה')===0?'לא זהה':fin.replace(/^\s+/,'').indexOf('זהה')===0?'זהה':'';
          const detail=status==='לא זהה'?fin.replace(/^\s*לא זהה\s*[:—-]?\s*/,''):'';
          return(<div key={li} style={{marginBottom:10}}>
            <div style={{fontSize:12.5,color:'#6b5e50',marginBottom:5,fontWeight:600}}>מפלס {li+1}{lv.name&&String(lv.name).trim()?' — '+String(lv.name).trim():''}</div>
            <div style={{display:'flex',gap:7}}>
              {optBtn(status==='זהה',()=>setFinish(li,'זהה'),'זהה','same')}
              {optBtn(status==='לא זהה',()=>setFinish(li,'לא זהה'+(detail?': '+detail:'')),'לא זהה','diff')}
            </div>
            {status==='לא זהה'&&<textarea value={detail} onChange={e=>setFinish(li,'לא זהה'+(e.target.value?': '+e.target.value:''))} rows={2} placeholder="פרט את השוני בגימור למפלס זה" style={{...iS,fontSize:14,marginTop:8,resize:'vertical',lineHeight:1.5}}/>}
          </div>);
        })}
      </div>;
    }
    return <div key={fl.k} style={{marginBottom:14}}>{fieldLabel(fl.l+(fl.req?' *':''))}{inp}</div>;
  };

  const buildRow=()=>{
    const d=new Date();
    const ts=`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
    const jm=k=>[...(f[k]||[]),String(f[k+'__oth']||'').trim()].filter(x=>x&&String(x).trim()).join(', ');
    const residentsOut=f.residents==='__family__'?familyLabel:(f.residents||'');
    const oVal=(f.divisionLevels||[]).map(lv=>{const items=(lv.items||[]).join(', ');if(!items)return '';return (lv.name||'').trim()?((lv.name||'').trim()+': '+items):items;}).filter(Boolean).join(', ');
    const pVal=encodeLevelTexts(f.divisionLevels,'free');
    const finishVal=encodeLevelTexts(f.divisionLevels,'finish');
    const qVal=buildDivisionQ(f.divisionLevels);
    const row=[ts,(info&&info.caseNum)||'','אחר',f.appraiserName||'',f.gushVerify?'בוצע':'',f.visitDate||'',
      f.elevator||'',f.floor||'',f.numFloors||'',f.aptNum||'',f.presenter||'',f.presenterId||'',
      f.presenterRelation||'',residentsOut,oVal,pVal,qVal,
      f.numRooms||'',jm('floorType'),jm('floorSize'),f.kitchenCabinets||'',f.sanitary||'',f.ceramicWalls||'',
      f.windows||'',f.interiorDoors||'',jm('ac'),f.physical||'',f.maintenance||'',f.locationMatch||'',
      f.internalDivision||'',f.internalDims||'',f.buildingViolations||'',f.violationsDetail||''];
    return [...row,'שמאי חיצוני',
      f.buildingType||'',f.roofType||'',f.buildingPhysical||'',f.buildingConstruction||'',f.exteriorCladding||'',
      f.propertyType||'',f.usage||'',f.envDescription||'',f.streetDescription||'',f.locationDescription||'',
      finishVal];
  };

  // שמירת טיוטה אוטומטית בכל שינוי בטופס (רק אחרי הטעינה, וכל עוד לא נשלח)
  useEffect(()=>{
    if(!draftReady.current||status!=='ready')return;
    const tm=setTimeout(()=>saveDraft(token,f),400);
    return ()=>clearTimeout(tm);
  },[f,status,token]);

  // אזהרה לפני סגירת הדף בזמן שליחה / העלאה
  useEffect(()=>{
    if(status!=='submitting'&&status!=='uploading')return;
    const h=e=>{e.preventDefault();e.returnValue='';return '';};
    window.addEventListener('beforeunload',h);
    return ()=>window.removeEventListener('beforeunload',h);
  },[status]);

  // העלאת קבצים (אחרי שהטופס כבר נשמר) — תור, ניסיונות חוזרים, דילוג על קיימים ואימות מול התיקייה. מחזיר את מה שלא עלה
  const uploadFiles=async(list)=>{await vu.addReady(list,token);await vuIdle();return vuNotDone(list);};

  const submit=async()=>{
    setErr('');
    if(!String(f.appraiserName||'').trim()){setErr('יש להזין את שם השמאי המבקר');return;}
    {const miss=missingRequiredVisitFields(f); // שמאי חיצוני — כל השדות חובה
     if(miss.length){setErr('יש למלא את כל השדות. חסר: '+miss.join(', '));return;}}
    setStatus('submitting');
    // 1) קודם שליחת שדות הטופס — כך הנתונים נשמרים מיד, גם אם העלאת הקבצים תיתקע
    setProgress('שולח את הטופס…');
    let j=null;
    try{
      const row=buildRow();
      const r=await fetchT(EXT_APPS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'visitSubmit',t:token,row})},60000);
      j=await r.json();
    }catch(e){setProgress('');setStatus('ready');setErr('שגיאת תקשורת בשליחה — הפרטים שמולאו שמורים בטלפון. בדוק חיבור לאינטרנט ונסה שוב.');return;}
    setProgress('');
    if(!(j&&j.ok)){setStatus('ready');setErr((j&&j.reason)||'ההגשה נכשלה. ייתכן שהקישור פג או שכבר נשלח ביקור.');return;}
    clearDraft(token);
    // 2) העלאת הקבצים (ההעלאה לא תלויה בניצול הקישור — רק בתוקף שלו)
    if(photos.length){
      setStatus('uploading');
      const failed=await uploadFiles(photos);
      setFailedFiles(failed);
    }
    setStatus('done');
    window.scrollTo({top:0,behavior:'smooth'});
  };

  const retryFailed=async()=>{
    const list=failedFiles; if(!list.length)return;
    setStatus('uploading');
    vu.retry(token);await vuIdle();
    setFailedFiles(vuNotDone(list));
    setStatus('done');
  };

  const wrap={maxWidth:720,margin:'0 auto',padding:'20px 16px 60px'};
  const card={background:'#fff',borderRadius:16,padding:'20px 22px',marginBottom:16,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',border:'1px solid #e8e0d4'};

  if(status==='loading') return (
    <div style={{...wrap,textAlign:'center',paddingTop:120}}>
      <div style={{width:64,height:64,margin:'0 auto',borderRadius:'50%',border:'3px solid rgba(217,175,52,.18)',borderTopColor:GOLD,animation:'spin .9s linear infinite'}}/>
      <div style={{marginTop:18,color:'#7a6a58'}}>טוען את פרטי הביקור…</div>
    </div>
  );

  if(status==='invalid') return (
    <div style={{...wrap,paddingTop:80}}>
      <div style={{...card,textAlign:'center'}}>
        <div style={{fontSize:40,marginBottom:10}}>🔒</div>
        <div style={{fontSize:18,fontWeight:600,color:'#1a1510',marginBottom:8}}>הקישור אינו זמין</div>
        <div style={{color:'#7a6a58',lineHeight:1.6}}>{reason||'הקישור אינו תקף, פג תוקפו, או שכבר נעשה בו שימוש. פנה למשרד לקבלת קישור חדש.'}</div>
      </div>
    </div>
  );

  if(status==='uploading') return (
    <div style={{...wrap,paddingTop:80}}>
      <div style={{...card,textAlign:'center'}}>
        <div style={{fontSize:40,marginBottom:8}}>✅</div>
        <div style={{fontSize:17,fontWeight:600,color:'#15803d',marginBottom:14}}>פרטי הביקור נשמרו במשרד</div>
        <div style={{width:48,height:48,margin:'0 auto',borderRadius:'50%',border:'3px solid rgba(217,175,52,.18)',borderTopColor:GOLD,animation:'spin .9s linear infinite'}}/>
        <div style={{marginTop:12,fontSize:16,fontWeight:600,color:GOLD3}}>{vuN?`מעלה קבצים… ${vuOk}/${vuN}`+(vuVid?` · סרטון ${Math.round((vuVid.prog||0)*100)}%`:''):(progress||'מעלה קבצים…')}</div>
        <div style={{marginTop:12,background:'#fff7e0',border:'1px solid #f0d78a',borderRadius:10,padding:'10px 14px',color:'#7a5a00',fontSize:14,lineHeight:1.6}}>
          ⚠️ נא לא לסגור את הדף ולא לנעול את המסך עד לסיום העלאת התמונות.
        </div>
      </div>
    </div>
  );

  if(status==='done') return (
    <div style={{...wrap,paddingTop:80}}>
      <div style={{...card,textAlign:'center',animation:'fadeIn .4s ease'}}>
        <div style={{fontSize:46,marginBottom:10}}>{failedFiles.length?'⚠️':'✅'}</div>
        <div style={{fontSize:19,fontWeight:600,color:'#15803d',marginBottom:8}}>דף הביקור נשלח בהצלחה</div>
        {failedFiles.length>0
          ? <div>
              <div style={{color:'#991b1b',lineHeight:1.6,marginBottom:10}}>
                {failedFiles.length===1?'קובץ אחד לא הועלה':failedFiles.length+' קבצים לא הועלו'} (כנראה בגלל חיבור חלש).<br/>אפשר לנסות שוב עכשיו, או לשלוח אותם למשרד בדרך אחרת.
              </div>
              <div style={{fontSize:12,color:'#7a6a58',marginBottom:12,wordBreak:'break-word'}}>{failedFiles.map(p=>p.name).join(' · ')}</div>
              <button onClick={retryFailed} style={{background:GOLD,color:'#1a0e00',border:'none',borderRadius:11,padding:'12px 22px',fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>🔄 נסה שוב להעלות</button>
            </div>
          : <div style={{color:'#7a6a58',lineHeight:1.6}}>תודה. הביקור{photos.length?' והקבצים':''} נשלחו למשרד לבדיקה ואישור. אפשר לסגור את הדף.</div>}
      </div>
    </div>
  );

  return (
    <div style={wrap}>
      <div style={{textAlign:'center',marginBottom:16}}>
        <img src="Logo_smol.png" alt="" style={{width:66,height:66,borderRadius:14,boxShadow:'0 4px 16px rgba(0,0,0,.08)'}}/>
        <h1 style={{fontSize:20,fontWeight:600,marginTop:12,color:'#1a1510'}}>דף ביקור בנכס</h1>
        <div style={{fontSize:13,color:'#9a8e84',marginTop:2}}>רובינשטיין רוזנטל — שמאות מקרקעין</div>
      </div>

      <div style={{...card,background:'#fdf7e6',border:'1px solid '+GOLD}}>
        <div style={{fontSize:12,color:'#8a7a58',marginBottom:2}}>כתובת הנכס לביקור</div>
        <div style={{fontSize:17,fontWeight:600,color:GOLD3}}>{(info&&info.address)||'—'}</div>
      </div>

      {isEdit&&<div style={{...card,background:'#eef6ff',border:'1px solid #bcd7f5'}}>
        <div style={{fontSize:14,fontWeight:700,color:'#1e40af',marginBottom:3}}>✏️ עריכת ביקור קיים</div>
        <div style={{fontSize:12.5,color:'#3a5a8a',lineHeight:1.6}}>הפרטים שמילאת נטענו מראש. בצע/י את התיקונים הנדרשים ושלח/י שוב — הביקור הקיים יתעדכן (לא ייווצר ביקור חדש).</div>
      </div>}

      {draftNote&&<div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',color:'#166534',borderRadius:10,padding:'10px 14px',marginBottom:14,fontSize:13.5,display:'flex',justifyContent:'space-between',alignItems:'center',gap:10}}>
        <span>💾 שוחזרו הפרטים שמילאת קודם בטלפון זה (התמונות אינן נשמרות — יש לצרף אותן שוב).</span>
        <button onClick={()=>setDraftNote(false)} style={{background:'none',border:'none',color:'#166534',cursor:'pointer',fontSize:16}}>×</button>
      </div>}

      {err&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',color:'#991b1b',borderRadius:10,padding:'10px 14px',marginBottom:14,fontSize:13.5}}>{err}</div>}

      <div style={card}>
        {VISIT_FIELDS.map(renderField)}
        {info&&info.photos&&<div style={{borderTop:'1px solid #f0ebe2',paddingTop:16,marginTop:8}}>
          <div style={{fontSize:14,fontWeight:700,color:GOLD3,marginBottom:6}}>📷 תמונות וסרטונים מהביקור</div>
          <div style={{fontSize:12.5,color:'#9a8e84',marginBottom:10}}>אפשר לצרף תמונות (באיכות גבוהה) וסרטונים מהנכס. סרטון עד 2GB לקובץ. קובץ שכבר הועלה לא יועלה שוב.</div>
          <label style={{display:'inline-block',border:`1.5px dashed ${GOLD}`,background:'#fff',color:GOLD3,borderRadius:9,padding:'10px 16px',cursor:'pointer',fontSize:14,fontWeight:600}}>
            ➕ בחר תמונות / סרטונים
            <input type="file" accept="image/*,video/*" multiple onChange={onPickFiles} style={{display:'none'}}/>
          </label>
          {photos.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:12}}>
            {photos.map((p,i)=>(
              <div key={i} style={{position:'relative',width:84,height:84,borderRadius:8,overflow:'hidden',border:'1px solid #e0d8cc',background:'#f0ede8'}}>
                {(p.isVideo||!p.url)
                  ? <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,padding:4}}>
                      <span style={{fontSize:24}}>{p.isVideo?'🎬':'🖼️'}</span>
                      <span style={{fontSize:9,color:'#7a6a58',textAlign:'center',lineHeight:1.2,wordBreak:'break-word',maxHeight:24,overflow:'hidden'}}>{p.name}</span>
                    </div>
                  : <img src={p.url} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>}
                <button onClick={()=>removePhoto(i)} style={{position:'absolute',top:2,right:2,background:'rgba(0,0,0,0.6)',color:'#fff',border:'none',borderRadius:'50%',width:20,height:20,cursor:'pointer',fontSize:12,lineHeight:1,padding:0}}>×</button>
              </div>
            ))}
          </div>}
        </div>}
        <div style={{borderTop:'1px solid #f0ebe2',paddingTop:16,marginTop:8}}>
          {err&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',color:'#991b1b',borderRadius:10,padding:'10px 14px',marginBottom:12,fontSize:13.5,lineHeight:1.6}}>{err}</div>}
          {photos.length>0&&status!=='submitting'&&<div style={{fontSize:12.5,color:'#7a6a58',marginBottom:10,lineHeight:1.5}}>הפרטים יישלחו מיד, ואחר כך יועלו {photos.length} קבצים. נא לא לסגור את הדף עד לסיום.</div>}
          <button onClick={submit} disabled={status==='submitting'}
            style={{width:'100%',background:status==='submitting'?'#e6ddcd':GOLD,color:status==='submitting'?'#b3a898':'#1a0e00',border:'none',borderRadius:11,padding:'14px',fontSize:16,fontWeight:700,cursor:status==='submitting'?'default':'pointer',fontFamily:'inherit'}}>
            {status==='submitting'?(progress||'שולח…'):'שליחת דף הביקור'}</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
